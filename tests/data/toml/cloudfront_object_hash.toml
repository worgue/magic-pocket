[general]
region = "ap-northeast-1"
project_name = "testprj"
stages = ["dev"]

[s3]

[container.main]
dockerfile_path = "tests/sampleprj/Dockerfile"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"
apigateway = {}

[container.main.django.storages]
default = { store = "filesystem" }
staticfiles = { store = "s3", static = true, distribution = "web", route = "static" }

[cloudfront.web]
domain = "cdn.example.com"

[[cloudfront.web.routes]]
type = "lambda"
handler = "main.wsgi"
is_default = true

[[cloudfront.web.routes]]
path_pattern = "/static/*"
ref = "static"
versioning = "object_hash"
sources = [
    { name = "data", dir = "data", exclude = ["*.tmp"] },
    { name = "code", dir = "build", hashed = false, prefix = "app/" },
]
