[general]
region = "ap-southeast-1"
project_name = "testprj"
stages = ["dev"]

[tidb]

[neon]
project_name = "dev-testprj"

[container.main]
dockerfile_path = "tests/sampleprj/Dockerfile"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

# deploy は Neon の API を呼ばず、`pocket resource neon store-url` が保存した
# URL を読むだけなので、managed ではなく user の type で宣言する
[container.main.secrets.user]
DATABASE_URL = { type = "neon_database_url" }
