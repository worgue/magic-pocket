[general]
region = "ap-northeast-1"
project_name = "err"
stages = ["dev"]

[container.app]
dockerfile_path = "Dockerfile"

[container.app.handlers.worker]
command = "app.worker"
sqs = { dead_letter_alert = { enabled = false } }

[s3]

[cloudfront.web]
routes = [{ is_default = true, origin_path = "/spa" }, { type = "lambda", path_pattern = "/api/*", handler = "app.worker" }]
