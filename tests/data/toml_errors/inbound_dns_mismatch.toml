[general]
region = "ap-northeast-1"
project_name = "err"
stages = ["dev"]

[container.app]
dockerfile_path = "Dockerfile"

[container.app.handlers.worker]
command = "app.worker"
sqs = { dead_letter_alert = { enabled = false } }

[container.app.handlers.worker2]
command = "app.worker"
sqs = { dead_letter_alert = { enabled = false } }

[inbound.support]
domain = "mail.example.com"
recipients = ["a@mail.example.com"]
handler = "app.worker"
retention_days = 30
delivery_alert = { enabled = false }

[inbound.other]
domain = "mail.example.com"
recipients = ["b@mail.example.com"]
handler = "app.worker2"
retention_days = 30
delivery_alert = { enabled = false }
manage_dns = false
