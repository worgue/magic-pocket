# [neon] / [tidb] / [upstash]。toml に無い credential は環境 (vector の context.env) から読む
[general]
region = "ap-northeast-1"
project_name = "prov"
stages = ["dev", "prod"]

[neon]
project_name = "prov-neon"
branch_name = "{stage}-{project}"
parent_branch_name = "main"
# strict の対象外なので整数の文字列も受ける
pg_version = "16"
# field 名 (api_key) で書いた値は Python と同じく捨てられ、環境の NEON_API_KEY が入る
api_key = "ignored"

[tidb]
project = "p1"
cluster = "c1"
region = "us-east-1"
provisioning = "command"

[upstash]
# Python (lax) と同じく桁区切りの文字列も受ける
budget = "1_000"

# alias (neon_api_key 等) で書けば toml の値が環境より優先される
[prod.neon]
neon_api_key = "toml-neon-key"
pg_version = 17

[prod.upstash]
upstash_email = "toml@example.com"
budget = "16.0"
