# [s3] / [vpc] の全 field と stage 上書き
[general]
region = "ap-northeast-1"
project_name = "s3vpc"
stages = ["dev", "prod", "shared"]

[vpc]
ref = "main"
zone_suffixes = ["a", "c"]
nat_gateway = true
internet_gateway = true
sharable = true

[s3]
bucket_name_format = "{project}-{stage}-assets"
versioning = true
cors = { methods = ["GET", "PUT"], cloudfront = "web" }
lifecycle_rules = [
    { id = "tmp", prefix = "tmp/", expiration_days = 1 },
    { id = "old", prefix = "", noncurrent_version_expiration_days = 30 },
]

# EFS は管理する VPC でだけ使える
[prod.vpc]
efs = { local_mount_path = "/mnt/data", access_point_path = "/app" }

# cors.cloudfront は配列でも書ける。lifecycle_rules は配列ごと置き換わる
[prod.s3]
cors = { methods = ["GET"], cloudfront = ["web", "admin"] }
lifecycle_rules = [{ id = "all", prefix = "", expiration_days = 365, noncurrent_version_expiration_days = 7 }]

# 管理しない VPC (既存 VPC を参照する)
[shared.vpc]
ref = "shared"
manage = false
sharable = false
zone_suffixes = []
