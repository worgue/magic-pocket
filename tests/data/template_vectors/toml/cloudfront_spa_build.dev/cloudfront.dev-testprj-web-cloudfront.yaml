AWSTemplateFormatVersion: "2010-09-09"
Description: spa configuration for webapp

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: "dev-testprj-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4


  UrlFallbackFunctionRoot:
    Type: AWS::CloudFront::Function
    Properties:
      Name: "dev-testprj-web-root-fallback"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var lastItem = request.uri.split('/').pop();
            if (!lastItem.includes('.')) {
                request.uri = '/index.html';
            }
            return request;
        }
      FunctionConfig:
        Comment: "CloudFront function for root"
        Runtime: cloudfront-js-2.0
  # cache-control は成功応答だけに付ける。ResponseHeadersPolicy はステータスを問わず
  # 付けるため、403 にも immutable が付いてブラウザに残る (KN1670)。
  CacheControlFunctionStatic:
    Type: AWS::CloudFront::Function
    Properties:
      Name: "dev-testprj-web-static-cache-control"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var response = event.response;
            var status = response.statusCode;
            if ((status >= 200 && status < 300) || status === 304) {
                response.headers['cache-control'] = { value: 'public, max-age=31536000, immutable' };
            }
            return response;
        }
      FunctionConfig:
        Comment: "Set cache-control on successful responses for static"
        Runtime: cloudfront-js-2.0




  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OriginAccessControl
      - UrlFallbackFunctionRoot
      - CacheControlFunctionStatic
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: "dev-testprj-pocket-root"
            DomainName: "dev-testprj-pocket.s3.ap-southeast-1.amazonaws.com"
            OriginPath: "/web/app"
            OriginAccessControlId:
              Fn::GetAtt: OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # Leave this blank because we use OAC(Origin Access Control)
          - Id: "dev-testprj-pocket-static"
            DomainName: "dev-testprj-pocket.s3.ap-southeast-1.amazonaws.com"
            OriginPath: "/web"
            OriginAccessControlId:
              Fn::GetAtt: OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # Leave this blank because we use OAC(Origin Access Control)
        DefaultCacheBehavior:
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
          TargetOriginId: "dev-testprj-pocket-root"
          ViewerProtocolPolicy: "redirect-to-https"
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt: UrlFallbackFunctionRoot.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
            TargetOriginId: "dev-testprj-pocket-static"
            ViewerProtocolPolicy: "redirect-to-https"
            PathPattern: "/static/*"
            FunctionAssociations:
              - EventType: viewer-response
                FunctionARN:
                  Fn::GetAtt: CacheControlFunctionStatic.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true



Outputs:
  DistributionId:
    Value:
      Ref: CloudFrontDistribution
  DistributionDomainName:
    Value:
      Fn::GetAtt: CloudFrontDistribution.DomainName
