AWSTemplateFormatVersion: "2010-09-09"
Description: spa configuration for webapp

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: "dev-testprj-main-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  TokenKvs:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: "dev-testprj-main-token-kvs"
      Comment: "KVS for SPA token secret / basic auth credential"

  UrlFallbackFunctionRoot:
    Type: AWS::CloudFront::Function
    Properties:
      Name: "dev-testprj-main-root-fallback"
      AutoPublish: true
      FunctionCode:
        Fn::Sub:
          - |
            import cf from 'cloudfront';
            var crypto = require('crypto');
            const kvsHandle = cf.kvs('${TokenKvs}');
            async function handler(event) {
                var request = event.request;
                var originalUri = request.uri;
                var lastItem = request.uri.split('/').pop();
                if (!lastItem.includes('.')) { request.uri = '/index.html'; }
                var cookie = request.cookies['pocket-spa-token'];
                if (!cookie) { return _redirect(originalUri); }
                // cookie ライブラリによっては値の ':' が %3A に percent-encode される
                // (axum-extra の CookieJar 等)。raw 値には no-op なので常に decode してから分割する。
                var value;
                try { value = decodeURIComponent(cookie.value); }
                catch (e) { return _redirect(originalUri); }
                var parts = value.split(':');
                if (parts.length !== 3) { return _redirect(originalUri); }
                var expiry = parseInt(parts[1], 10);
                if (Math.floor(Date.now() / 1000) > expiry) { return _redirect(originalUri); }
                var secret;
                try { secret = await kvsHandle.get('token_secret'); }
                catch (e) { return _redirect(originalUri); }
                var msg = parts[0] + ':' + parts[1];
                var hmac = crypto.createHmac('sha256', Buffer.from(secret, 'hex'));
                var sig = hmac.update(msg).digest('hex');
                if (sig !== parts[2]) { return _redirect(originalUri); }
                return request;
            }
            function _redirect(uri) {
                var next = encodeURIComponent(uri);
                return { statusCode: 302, statusDescription: 'Found',
                    headers: { location: { value: '/api/auth/login?next=' + next } } };
            }
          - TokenKvs:
              Fn::GetAtt: TokenKvs.Id
      FunctionConfig:
        Comment: "CloudFront function for root"
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN:
              Fn::GetAtt: TokenKvs.Arn




  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OriginAccessControl
      - UrlFallbackFunctionRoot
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: "dev-testprj-pocket-root"
            DomainName: "dev-testprj-pocket.s3.ap-southeast-1.amazonaws.com"
            OriginPath: "/main"
            OriginAccessControlId:
              Fn::GetAtt: OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # Leave this blank because we use OAC(Origin Access Control)
        DefaultCacheBehavior:
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
          TargetOriginId: "dev-testprj-pocket-root"
          ViewerProtocolPolicy: "redirect-to-https"
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt: UrlFallbackFunctionRoot.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true



Outputs:
  DistributionId:
    Value:
      Ref: CloudFrontDistribution
  DistributionDomainName:
    Value:
      Fn::GetAtt: CloudFrontDistribution.DomainName
  TokenKvsArn:
    Value:
      Fn::GetAtt: TokenKvs.Arn
    Export:
      Name: "dev-testprj-main-token-kvs-arn"
