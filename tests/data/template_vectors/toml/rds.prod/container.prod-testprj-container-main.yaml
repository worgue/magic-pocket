AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)
  LambdaRole:
    # This role must be created before the lambda function.
    # https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    # When you change Role, you must delete function and role.
    # https://www.lastweekinaws.com/blog/the-sneaky-weakness-behind-aws-managed-kms-keys/
    # 中身は pocket_cli/resources/aws/iam_roles.py の lambda_role
    Type: AWS::IAM::Role
    Properties: {"AssumeRolePolicyDocument": {"Statement": [{"Action": "sts:AssumeRole", "Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}}]}, "ManagedPolicyArns": ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole", "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"], "Policies": [{"PolicyDocument": {"Statement": [{"Action": ["secretsmanager:GetSecretValue"], "Condition": {"StringEquals": {"aws:ResourceTag/aws:rds:primaryDBClusterArn": {"Fn::Sub": "arn:${AWS::Partition}:rds:ap-northeast-1:${AWS::AccountId}:cluster:prod-testprj-pocket-aurora"}}}, "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:secretsmanager:ap-northeast-1:${AWS::AccountId}:secret:rds!cluster-*"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-testprj-pocket-access-rds-secret"}, {"PolicyDocument": {"Statement": [{"Action": ["cloudformation:DescribeStacks"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/prod-testprj-*"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-testprj-pocket-access-cloudformation"}], "RoleName": "lambda-prod-testprj-main-pocket"}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "prod-testprj-pocket-main-lambda"
      GroupName: "prod-testprj-pocket-main-lambda"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: "prod-testprj-pocket-main-lambda"
      VpcId:
        Fn::ImportValue: "main-pocket-vpc-id"

  "WsgiLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "prod-testprj-pocket-main-wsgi"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::GetAtt": "LambdaRole.Arn"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/prod-testprj-pocket-main-lambda:prod"
      ImageConfig:
        Command:
          - "pocket.django.lambda_handlers.wsgi_handler"
      Environment:
        Variables:
          "POCKET_STAGE": "prod"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "main"
          "DEPLOY_HASH": "abc1234"
          "POCKET_RDS_SECRET_ARN": "arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:rds!cluster-vector"
          "POCKET_RDS_ENDPOINT": "prod-testprj-pocket-aurora.cluster-vector.ap-northeast-1.rds.amazonaws.com"
          "POCKET_RDS_PORT": "5432"
          "POCKET_RDS_DBNAME": "prod_testprj"
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: "main-pocket-private-subnet-1"
          - Fn::ImportValue: "main-pocket-private-subnet-2"






  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)
  LambdaRDSAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: "sg-0123456789abcdef0"
      SourceSecurityGroupId:
        Ref: LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432

Outputs:
  "WsgiLambdaFunction":
    Value:
      Fn::GetAtt: "WsgiLambdaFunction.Arn"
