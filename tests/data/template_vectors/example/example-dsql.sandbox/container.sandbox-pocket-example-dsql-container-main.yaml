AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)


  "WsgiLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "sandbox-pocket-example-dsql-pocket-main-wsgi"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sandbox-pocket-example-dsql-myorg-lambda-role"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sandbox-pocket-example-dsql-pocket-main-lambda:sandbox"
      ImageConfig:
        Command:
          - "pocket-example-dsql-lambda"
      Environment:
        Variables:
          "POCKET_STAGE": "sandbox"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "main"
          POCKET_INBOUND:
            Fn::Sub: "{\"inbox\": {\"bucket\": \"sandbox-pocket-example-dsql-pock-df065f0823-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"test@inbound.dsql.sandbox.magic-pocket.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:sandbox-pocket-example-dsql-pock-df065f0823\"}}"
          "DEPLOY_HASH": "abc1234"
          "POCKET_DSQL_ENDPOINT": "vectordsqlclusteridentifier.dsql.ap-northeast-1.on.aws"
          "POCKET_DSQL_REGION": "ap-northeast-1"
  "WorkerLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "sandbox-pocket-example-dsql-pocket-main-worker"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sandbox-pocket-example-dsql-myorg-lambda-role"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sandbox-pocket-example-dsql-pocket-main-lambda:sandbox"
      ImageConfig:
        Command:
          - "pocket-example-dsql-worker"
      Environment:
        Variables:
          "POCKET_STAGE": "sandbox"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "main"
          POCKET_INBOUND:
            Fn::Sub: "{\"inbox\": {\"bucket\": \"sandbox-pocket-example-dsql-pock-df065f0823-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"test@inbound.dsql.sandbox.magic-pocket.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:sandbox-pocket-example-dsql-pock-df065f0823\"}}"
          "DEPLOY_HASH": "abc1234"
          "POCKET_DSQL_ENDPOINT": "vectordsqlclusteridentifier.dsql.ap-northeast-1.on.aws"
          "POCKET_DSQL_REGION": "ap-northeast-1"
  "MailLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "sandbox-pocket-example-dsql-pocket-main-mail"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "60"
      Role: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sandbox-pocket-example-dsql-myorg-lambda-role"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sandbox-pocket-example-dsql-pocket-main-lambda:sandbox"
      ImageConfig:
        Command:
          - "pocket-example-dsql-mail-worker"
      Environment:
        Variables:
          "POCKET_STAGE": "sandbox"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "main"
          POCKET_INBOUND:
            Fn::Sub: "{\"inbox\": {\"bucket\": \"sandbox-pocket-example-dsql-pock-df065f0823-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"test@inbound.dsql.sandbox.magic-pocket.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:sandbox-pocket-example-dsql-pock-df065f0823\"}}"
          "DEPLOY_HASH": "abc1234"
          "POCKET_DSQL_ENDPOINT": "vectordsqlclusteridentifier.dsql.ap-northeast-1.on.aws"
          "POCKET_DSQL_REGION": "ap-northeast-1"

  "WsgiApigatewayCloudWatchLogsGroup":
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "sandbox-pocket-example-dsql-main-wsgi-apigateway"
      RetentionInDays: 365

  "WsgiApi":
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "sandbox-pocket-example-dsql-main-wsgi"
      ProtocolType: HTTP
      Target:
        Fn::GetAtt: "WsgiLambdaFunction.Arn"
      DisableExecuteApiEndpoint: "False"

  "WsgiApiGatewayManagedOverrides":
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId:
        Ref: "WsgiApi"
      Stage:
        AutoDeploy: true
        AccessLogSettings:
          DestinationArn:
            Fn::GetAtt: "WsgiApigatewayCloudWatchLogsGroup.Arn"
          Format: >-
            {"requestTime": "$context.requestTime",
            "requestId": "$context.requestId",
            "httpMethod": "$context.httpMethod",
            "path": "$context.path",
            "routeKey": "$context.routeKey",
            "status": $context.status,
            "responseLatency": $context.responseLatency,
            "integrationRequestId": "$context.integration.requestId",
            "functionResponseStatus": "$context.integration.status",
            "integrationLatency": "$context.integration.latency",
            "integrationServiceStatus": "$context.integration.integrationStatus",
            "integrationErrorMessage": "$context.integrationErrorMessage",
            "ip": "$context.identity.sourceIp",
            "userAgent": "$context.identity.userAgent"}

  "WsgiRoute":
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - "WsgiIntegration"
    Properties:
      ApiId:
        Ref: "WsgiApi"
      RouteKey: "ANY /{proxy+}"
      Target:
        Fn::Join:
          - /
          - - integrations
            - Ref: "WsgiIntegration"

  "WsgiIntegration":
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: "WsgiApi"
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":apigateway:"
            - Ref: "AWS::Region"
            - ":lambda:path/2015-03-31/functions/"
            - Fn::GetAtt: "WsgiLambdaFunction.Arn"
            - /invocations
      PayloadFormatVersion: "2.0"

  "WsgiPermission":
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: "WsgiLambdaFunction"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":execute-api:"
            - Ref: "AWS::Region"
            - ":"
            - Ref: "AWS::AccountId"
            - ":"
            - Ref: "WsgiApi"
            - "/*/*"




  "WorkerSqsQueue":
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "sandbox-pocket-example-dsql-pocket-main-worker"
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: "WorkerDeadLetterQueue.Arn"
        maxReceiveCount: "5"
      VisibilityTimeout: "180"
      # default 4 days
      MessageRetentionPeriod: "345600"

  "WorkerDeadLetterQueue":
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "sandbox-pocket-example-dsql-pocket-main-worker-dead-letter"
      # max 14 days
      MessageRetentionPeriod: "1209600"

  # DLQ 到達の通知 (dead_letter_alert 宣言時のみ)。email 購読は宛先が確認メールの
  # リンクを踏むまで PendingConfirmation のままで通知が届かない点に注意
  # (deploy 後の購読状態チェックと pocket status で可視化する)
  "WorkerDeadLetterAlertTopic":
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "sandbox-pocket-example-dsql-pocket-main-worker-dead-letter-alert"

  "WorkerDeadLetterAlertSubscription":
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: "WorkerDeadLetterAlertTopic"
      Protocol: email
      Endpoint: "alerts@example.com"

  "WorkerDeadLetterAlarm":
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "sandbox-pocket-example-dsql-pocket-main-worker-dead-letter-alert"
      AlarmDescription: "Messages arrived in the dead-letter queue of sandbox-pocket-example-dsql-pocket-main-worker"
      Namespace: "AWS/SQS"
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt: "WorkerDeadLetterQueue.QueueName"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # DLQ が空の間はメトリクス欠測になりうるため、欠測 = 正常として扱う
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: "WorkerDeadLetterAlertTopic"
      # 復旧 (redrive / purge で DLQ が空に戻った) も通知する
      OKActions:
        - Ref: "WorkerDeadLetterAlertTopic"

  "WorkerSqsEventSourceMapping":
    DependsOn:
      - "WorkerSqsQueue"
      - "WorkerLambdaFunction"
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt: "WorkerSqsQueue.Arn"
      FunctionName:
        Ref: "WorkerLambdaFunction"
      BatchSize: "10"
      ScalingConfig:
        MaximumConcurrency: "2"
      FunctionResponseTypes:
        - "ReportBatchItemFailures"
  "MailSqsQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "sandbox-pocket-example-dsql-pocket-main-mail"
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: "MailDeadLetterQueue.Arn"
        maxReceiveCount: "5"
      VisibilityTimeout: "360"
      # default 4 days
      MessageRetentionPeriod: "1209600"

  "MailDeadLetterQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "sandbox-pocket-example-dsql-pocket-main-mail-dead-letter"
      # max 14 days
      MessageRetentionPeriod: "1209600"

  # DLQ 到達の通知 (dead_letter_alert 宣言時のみ)。email 購読は宛先が確認メールの
  # リンクを踏むまで PendingConfirmation のままで通知が届かない点に注意
  # (deploy 後の購読状態チェックと pocket status で可視化する)
  "MailDeadLetterAlertTopic":
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "sandbox-pocket-example-dsql-pocket-main-mail-dead-letter-alert"

  "MailDeadLetterAlertSubscription":
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: "MailDeadLetterAlertTopic"
      Protocol: email
      Endpoint: "alerts@example.com"

  "MailDeadLetterAlarm":
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "sandbox-pocket-example-dsql-pocket-main-mail-dead-letter-alert"
      AlarmDescription: "Messages arrived in the dead-letter queue of sandbox-pocket-example-dsql-pocket-main-mail"
      Namespace: "AWS/SQS"
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt: "MailDeadLetterQueue.QueueName"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # DLQ が空の間はメトリクス欠測になりうるため、欠測 = 正常として扱う
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: "MailDeadLetterAlertTopic"
      # 復旧 (redrive / purge で DLQ が空に戻った) も通知する
      OKActions:
        - Ref: "MailDeadLetterAlertTopic"

  "MailSqsEventSourceMapping":
    DependsOn:
      - "MailSqsQueue"
      - "MailLambdaFunction"
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt: "MailSqsQueue.Arn"
      FunctionName:
        Ref: "MailLambdaFunction"
      BatchSize: "10"
      ScalingConfig:
        MaximumConcurrency: "2"
      FunctionResponseTypes:
        - "ReportBatchItemFailures"


  "DailyMessageSchedule":
    Type: AWS::Scheduler::Schedule
    DependsOn:
      - "WorkerSqsQueue"
    Properties:
      Name: "sandbox-pocket-example-dsql-pocket-daily-message"
      ScheduleExpression: "rate(1 day)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        # SQS universal target: Input が MessageBody として送信される
        Arn:
          Fn::GetAtt: "WorkerSqsQueue.Arn"
        RoleArn: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sandbox-pocket-example-dsql-myorg-scheduler-role"}
        Input: "{\"type\": \"post_message\", \"note\": \"scheduled\"}"


  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)

Outputs:
  "WsgiLambdaFunction":
    Value:
      Fn::GetAtt: "WsgiLambdaFunction.Arn"
  "WsgiApiDomain":
    Value:
      Fn::Sub:
        - "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
        - ApiId:
            Ref: "WsgiApi"
    Export:
      Name: "sandbox-pocket-example-dsql-main-wsgi-api-domain"
  "WsgiApiEndpoint":
    Value:
      Fn::GetAtt: "WsgiApi.ApiEndpoint"
  "WorkerLambdaFunction":
    Value:
      Fn::GetAtt: "WorkerLambdaFunction.Arn"
  "WorkerDeadLetterAlarmArn":
    Value:
      Fn::GetAtt: "WorkerDeadLetterAlarm.Arn"
  "MailLambdaFunction":
    Value:
      Fn::GetAtt: "MailLambdaFunction.Arn"
  "MailDeadLetterAlarmArn":
    Value:
      Fn::GetAtt: "MailDeadLetterAlarm.Arn"
