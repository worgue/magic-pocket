AWSTemplateFormatVersion: "2010-09-09"
Description: spa configuration for webapp

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: "sandbox-pocket-example-dsql-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4


  UrlFallbackFunctionRoot:
    Type: AWS::CloudFront::Function
    Properties:
      Name: "sandbox-pocket-example-dsql-web-root-fallback"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var lastItem = request.uri.split('/').pop();
            if (!lastItem.includes('.')) {
                request.uri = '/200.html';
            }
            return request;
        }
      FunctionConfig:
        Comment: "CloudFront function for root"
        Runtime: cloudfront-js-2.0

  ApiHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: "sandbox-pocket-example-dsql-web-api-host"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            request.headers['x-forwarded-host'] = { value: request.headers.host.value };
            // event.viewer.ip は CloudFront が TCP 接続から取得する viewer IP で詐称不可。
            // viewer が同名 header を送っても上書きするため、origin は真の client IP を
            // 信頼できる。OriginVerifyMiddleware が REMOTE_ADDR に正規化する。
            request.headers['x-pocket-viewer-ip'] = { value: event.viewer.ip };
            return request;
        }
      FunctionConfig:
        Comment: "Add X-Forwarded-Host for API routes"
        Runtime: cloudfront-js-2.0



  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OriginAccessControl
      - UrlFallbackFunctionRoot
      - ApiHostFunction
    Properties:
      DistributionConfig:
        Aliases:
          - "dsql.sandbox.magic-pocket.example.com"
        Enabled: true
        Origins:
          - Id: "sandbox-pocket-example-dsql-pocket-root"
            DomainName: "sandbox-pocket-example-dsql-pocket.s3.ap-northeast-1.amazonaws.com"
            OriginPath: "/spa"
            OriginAccessControlId:
              Fn::GetAtt: OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # Leave this blank because we use OAC(Origin Access Control)
          - Id: "sandbox-pocket-example-dsql-pocket-api-main.wsgi"
            DomainName:
              Fn::ImportValue: "sandbox-pocket-example-dsql-main-wsgi-api-domain"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
        DefaultCacheBehavior:
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
          TargetOriginId: "sandbox-pocket-example-dsql-pocket-root"
          ViewerProtocolPolicy: "redirect-to-https"
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt: UrlFallbackFunctionRoot.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad" # Managed-CachingDisabled
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac" # Managed-AllViewerExceptHostHeader
            TargetOriginId: "sandbox-pocket-example-dsql-pocket-api-main.wsgi"
            ViewerProtocolPolicy: "redirect-to-https"
            PathPattern: "/api/*"
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN:
                  Fn::GetAtt: ApiHostFunction.FunctionMetadata.FunctionARN
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
        ViewerCertificate:
          AcmCertificateArn: "arn:aws:acm:us-east-1:123456789012:certificate/sandbox-pocket-example-dsql-web-acm"
          SslSupportMethod: sni-only

  DNSRecord:
    Type: AWS::Route53::RecordSet
    DependsOn:
      - CloudFrontDistribution
    Properties:
      HostedZoneId: "ZSANDBOX"
      Name: "dsql.sandbox.magic-pocket.example.com"
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # Z2FDTNDATAQYW2 is the fixed hosted zone id for cloudfront
        DNSName:
          Fn::GetAtt: CloudFrontDistribution.DomainName


Outputs:
  DistributionId:
    Value:
      Ref: CloudFrontDistribution
  DistributionDomainName:
    Value:
      Fn::GetAtt: CloudFrontDistribution.DomainName
