AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)
  LambdaRole:
    # This role must be created before the lambda function.
    # https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    # When you change Role, you must delete function and role.
    # https://www.lastweekinaws.com/blog/the-sneaky-weakness-behind-aws-managed-kms-keys/
    # 中身は pocket_cli/resources/aws/iam_roles.py の lambda_role
    Type: AWS::IAM::Role
    Properties: {"AssumeRolePolicyDocument": {"Statement": [{"Action": "sts:AssumeRole", "Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}}]}, "ManagedPolicyArns": ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole", "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"], "Policies": [{"PolicyDocument": {"Statement": [{"Action": ["secretsmanager:GetSecretValue"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:prod-db-app-pocket-AbCdEf"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-db-pocket-access-secretsmanager"}, {"PolicyDocument": {"Statement": [{"Action": ["secretsmanager:GetSecretValue"], "Condition": {"StringEquals": {"aws:ResourceTag/aws:rds:primaryDBClusterArn": {"Fn::Sub": "arn:${AWS::Partition}:rds:ap-northeast-1:${AWS::AccountId}:cluster:prod-db-pocket-aurora"}}}, "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:secretsmanager:ap-northeast-1:${AWS::AccountId}:secret:rds!cluster-*"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-db-pocket-access-rds-secret"}, {"PolicyDocument": {"Statement": [{"Action": ["dsql:DbConnectAdmin"], "Condition": {"StringEquals": {"aws:ResourceTag/Name": "prod-db-pocket-dsql"}}, "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:dsql:ap-northeast-1:${AWS::AccountId}:cluster/*"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-db-pocket-access-dsql"}, {"PolicyDocument": {"Statement": [{"Action": ["cloudformation:DescribeStacks"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/prod-db-*"}]}], "Version": "2012-10-17"}, "PolicyName": "prod-db-pocket-access-cloudformation"}], "RoleName": "lambda-prod-db-app-pocket"}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "prod-db-pocket-app-lambda"
      GroupName: "prod-db-pocket-app-lambda"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: "prod-db-pocket-app-lambda"
      VpcId:
        Fn::ImportValue: "main-pocket-vpc-id"






  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)
  LambdaRDSAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: "sg-0123456789abcdef0"
      SourceSecurityGroupId:
        Ref: LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432

