AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)
  LambdaRole:
    # This role must be created before the lambda function.
    # https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    # When you change Role, you must delete function and role.
    # https://www.lastweekinaws.com/blog/the-sneaky-weakness-behind-aws-managed-kms-keys/
    # 中身は pocket_cli/resources/aws/iam_roles.py の lambda_role
    Type: AWS::IAM::Role
    Properties: {"AssumeRolePolicyDocument": {"Statement": [{"Action": "sts:AssumeRole", "Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}}]}, "ManagedPolicyArns": ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonRoute53FullAccess"], "Policies": [{"PolicyDocument": {"Statement": [{"Action": ["secretsmanager:GetSecretValue"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:dev-cf-app-pocket-AbCdEf"}, {"Fn::Sub": "arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:dev-cf-pocket-AbCdEf"}]}], "Version": "2012-10-17"}, "PolicyName": "dev-cf-pocket-access-secretsmanager"}, {"PolicyDocument": {"Statement": [{"Action": ["cloudformation:DescribeStacks"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-cf-*"}]}], "Version": "2012-10-17"}, "PolicyName": "dev-cf-pocket-access-cloudformation"}], "RoleName": "lambda-dev-cf-app-pocket"}


  "WsgiLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "dev-cf-pocket-app-wsgi"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::GetAtt": "LambdaRole.Arn"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dev-cf-pocket-app-lambda:dev"
      ImageConfig:
        Command:
          - "pocket.django.lambda_handlers.wsgi_handler"
      Environment:
        Variables:
          "POCKET_STAGE": "dev"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "app"
          "DEPLOY_HASH": "abc1234"
          "SIGNING_KEY_ID":
            Fn::ImportValue: "dev-cf-web-public-key-id"

  "WsgiApigatewayCloudWatchLogsGroup":
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "dev-cf-app-wsgi-apigateway"
      RetentionInDays: 365

  "WsgiApi":
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "dev-cf-app-wsgi"
      ProtocolType: HTTP
      Target:
        Fn::GetAtt: "WsgiLambdaFunction.Arn"
      DisableExecuteApiEndpoint: "False"

  "WsgiApiGatewayManagedOverrides":
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId:
        Ref: "WsgiApi"
      Stage:
        AutoDeploy: true
        AccessLogSettings:
          DestinationArn:
            Fn::GetAtt: "WsgiApigatewayCloudWatchLogsGroup.Arn"
          Format: >-
            {"requestTime": "$context.requestTime",
            "requestId": "$context.requestId",
            "httpMethod": "$context.httpMethod",
            "path": "$context.path",
            "routeKey": "$context.routeKey",
            "status": $context.status,
            "responseLatency": $context.responseLatency,
            "integrationRequestId": "$context.integration.requestId",
            "functionResponseStatus": "$context.integration.status",
            "integrationLatency": "$context.integration.latency",
            "integrationServiceStatus": "$context.integration.integrationStatus",
            "integrationErrorMessage": "$context.integrationErrorMessage",
            "ip": "$context.identity.sourceIp",
            "userAgent": "$context.identity.userAgent"}

  "WsgiRoute":
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - "WsgiIntegration"
    Properties:
      ApiId:
        Ref: "WsgiApi"
      RouteKey: "ANY /{proxy+}"
      Target:
        Fn::Join:
          - /
          - - integrations
            - Ref: "WsgiIntegration"

  "WsgiIntegration":
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: "WsgiApi"
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":apigateway:"
            - Ref: "AWS::Region"
            - ":lambda:path/2015-03-31/functions/"
            - Fn::GetAtt: "WsgiLambdaFunction.Arn"
            - /invocations
      PayloadFormatVersion: "2.0"

  "WsgiPermission":
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: "WsgiLambdaFunction"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":execute-api:"
            - Ref: "AWS::Region"
            - ":"
            - Ref: "AWS::AccountId"
            - ":"
            - Ref: "WsgiApi"
            - "/*/*"





  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)

Outputs:
  "WsgiLambdaFunction":
    Value:
      Fn::GetAtt: "WsgiLambdaFunction.Arn"
  "WsgiApiDomain":
    Value:
      Fn::Sub:
        - "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
        - ApiId:
            Ref: "WsgiApi"
    Export:
      Name: "dev-cf-app-wsgi-api-domain"
  "WsgiApiEndpoint":
    Value:
      Fn::GetAtt: "WsgiApi.ApiEndpoint"
