AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront signing key resources

Resources:
  PublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: "live-ctx-pocket-publickey"
        CallerReference: "live-ctx-pocket-publickey"
        EncodedKey: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvector
          -----END PUBLIC KEY-----


  KeyGroup:
    Type: AWS::CloudFront::KeyGroup
    DependsOn:
      - PublicKey
    Properties:
      KeyGroupConfig:
        Name: "live-ctx-pocket-keygroup"
        Items:
          - !Ref PublicKey

Outputs:
  PublicKeyId:
    Value: !Ref PublicKey
    Export:
      Name: "live-ctx-web-public-key-id"
  KeyGroupId:
    Value: !Ref KeyGroup
    Export:
      Name: "live-ctx-web-key-group-id"
