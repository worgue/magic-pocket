AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "dev-ctx-pocket-web-lambda"
      GroupName: "dev-ctx-pocket-web-lambda"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: "dev-ctx-pocket-web-lambda"
      VpcId:
        Fn::ImportValue: "main-pocket-vpc-id"

  "WsgiLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "dev-ctx-pocket-web-wsgi"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-ctx-myorg-lambda-role"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dev-ctx-pocket-web-lambda:dev"
      ImageConfig:
        Command:
          - "pocket.django.lambda_handlers.wsgi_handler"
      Environment:
        Variables:
          "POCKET_STAGE": "dev"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "web"
          POCKET_INBOUND:
            Fn::Sub: "{\"support\": {\"bucket\": \"dev-ctx-pocket-inbound-support-41d19ddf04-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"support@mail.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:dev-ctx-pocket-inbound-support-41d19ddf04\"}}"
          "DEPLOY_HASH": "env-hash-1"
          "SIGNING1":
            Fn::ImportValue: "dev-ctx-web-public-key-id"
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: "main-pocket-private-subnet-1"
          - Fn::ImportValue: "main-pocket-private-subnet-2"
      FileSystemConfigs:
        - Arn:
            Fn::ImportValue: "main-pocket-efs-access-point"
          LocalMountPath: "/mnt/data"
  "MailLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "dev-ctx-pocket-web-mail"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-ctx-myorg-lambda-role"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dev-ctx-pocket-web-lambda:dev"
      ImageConfig:
        Command:
          - "app.mail"
      Environment:
        Variables:
          "POCKET_STAGE": "dev"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "web"
          POCKET_INBOUND:
            Fn::Sub: "{\"support\": {\"bucket\": \"dev-ctx-pocket-inbound-support-41d19ddf04-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"support@mail.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:dev-ctx-pocket-inbound-support-41d19ddf04\"}}"
          "DEPLOY_HASH": "env-hash-1"
          "SIGNING1":
            Fn::ImportValue: "dev-ctx-web-public-key-id"
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: "main-pocket-private-subnet-1"
          - Fn::ImportValue: "main-pocket-private-subnet-2"
      FileSystemConfigs:
        - Arn:
            Fn::ImportValue: "main-pocket-efs-access-point"
          LocalMountPath: "/mnt/data"

  "WsgiApigatewayCloudWatchLogsGroup":
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "dev-ctx-web-wsgi-apigateway"
      RetentionInDays: 365

  "WsgiApi":
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "dev-ctx-web-wsgi"
      ProtocolType: HTTP
      Target:
        Fn::GetAtt: "WsgiLambdaFunction.Arn"
      DisableExecuteApiEndpoint: "True"

  "WsgiApiGatewayManagedOverrides":
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId:
        Ref: "WsgiApi"
      Stage:
        AutoDeploy: true
        AccessLogSettings:
          DestinationArn:
            Fn::GetAtt: "WsgiApigatewayCloudWatchLogsGroup.Arn"
          Format: >-
            {"requestTime": "$context.requestTime",
            "requestId": "$context.requestId",
            "httpMethod": "$context.httpMethod",
            "path": "$context.path",
            "routeKey": "$context.routeKey",
            "status": $context.status,
            "responseLatency": $context.responseLatency,
            "integrationRequestId": "$context.integration.requestId",
            "functionResponseStatus": "$context.integration.status",
            "integrationLatency": "$context.integration.latency",
            "integrationServiceStatus": "$context.integration.integrationStatus",
            "integrationErrorMessage": "$context.integrationErrorMessage",
            "ip": "$context.identity.sourceIp",
            "userAgent": "$context.identity.userAgent"}

  "WsgiRoute":
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - "WsgiIntegration"
    Properties:
      ApiId:
        Ref: "WsgiApi"
      RouteKey: "ANY /{proxy+}"
      Target:
        Fn::Join:
          - /
          - - integrations
            - Ref: "WsgiIntegration"

  "WsgiIntegration":
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: "WsgiApi"
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":apigateway:"
            - Ref: "AWS::Region"
            - ":lambda:path/2015-03-31/functions/"
            - Fn::GetAtt: "WsgiLambdaFunction.Arn"
            - /invocations
      PayloadFormatVersion: "2.0"

  "WsgiPermission":
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: "WsgiLambdaFunction"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":execute-api:"
            - Ref: "AWS::Region"
            - ":"
            - Ref: "AWS::AccountId"
            - ":"
            - Ref: "WsgiApi"
            - "/*/*"

  "WsgiCertificate":
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: "api.project.com"
      DomainValidationOptions:
        - DomainName: "api.project.com"
          HostedZoneId: "ZPROJECT"
      Tags:
        - Key: Name
          Value: "dev-ctx-web-wsgi-cert"
      ValidationMethod: DNS

  ##### Warning #####
  # Api Gateway does not support http, so you must use http.
  # Moreover you can not just redirect http to https.
  #  - https://stackoverflow.com/a/58683733
  #  - https://stackoverflow.com/q/47311081
  ###################
  "WsgiApiGatewayDomainName":
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: "api.project.com"
      DomainNameConfigurations:
        - CertificateArn:
            Ref: "WsgiCertificate"

  "WsgiDNSRecord":
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: "ZPROJECT"
      Name: "api.project.com"
      Type: A
      AliasTarget:
        HostedZoneId:
          Fn::GetAtt: "WsgiApiGatewayDomainName.RegionalHostedZoneId"
        DNSName:
          Fn::GetAtt: "WsgiApiGatewayDomainName.RegionalDomainName"

  "WsgiApiGatewayApiMapping":
    DependsOn:
      - "WsgiApiGatewayDomainName"
    Type: "AWS::ApiGatewayV2::ApiMapping"
    Properties:
      DomainName: "api.project.com"
      ApiId:
        Ref: "WsgiApi"
      Stage: "$default"


  "MailSqsQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "dev-ctx-pocket-web-mail"
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: "MailDeadLetterQueue.Arn"
        maxReceiveCount: "5"
      VisibilityTimeout: "180"
      # default 4 days
      MessageRetentionPeriod: "1209600"

  "MailDeadLetterQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "dev-ctx-pocket-web-mail-dead-letter"
      # max 14 days
      MessageRetentionPeriod: "1209600"

  # DLQ 到達の通知 (dead_letter_alert 宣言時のみ)。email 購読は宛先が確認メールの
  # リンクを踏むまで PendingConfirmation のままで通知が届かない点に注意
  # (deploy 後の購読状態チェックと pocket status で可視化する)
  "MailDeadLetterAlertTopic":
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "dev-ctx-pocket-web-mail-dead-letter-alert"

  "MailDeadLetterAlertSubscription":
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: "MailDeadLetterAlertTopic"
      Protocol: email
      Endpoint: "ops@example.com"

  "MailDeadLetterAlarm":
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "dev-ctx-pocket-web-mail-dead-letter-alert"
      AlarmDescription: "Messages arrived in the dead-letter queue of dev-ctx-pocket-web-mail"
      Namespace: "AWS/SQS"
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt: "MailDeadLetterQueue.QueueName"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # DLQ が空の間はメトリクス欠測になりうるため、欠測 = 正常として扱う
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: "MailDeadLetterAlertTopic"
      # 復旧 (redrive / purge で DLQ が空に戻った) も通知する
      OKActions:
        - Ref: "MailDeadLetterAlertTopic"

  "MailSqsEventSourceMapping":
    DependsOn:
      - "MailSqsQueue"
      - "MailLambdaFunction"
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt: "MailSqsQueue.Arn"
      FunctionName:
        Ref: "MailLambdaFunction"
      BatchSize: "10"
      ScalingConfig:
        MaximumConcurrency: "2"
      FunctionResponseTypes:
        - "ReportBatchItemFailures"


  LambdaEFSAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: "main-pocket-efs-security-group"
      SourceSecurityGroupId:
        Ref: LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049

  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)

Outputs:
  "WsgiLambdaFunction":
    Value:
      Fn::GetAtt: "WsgiLambdaFunction.Arn"
  "WsgiApiDomain":
    Value:
      Fn::Sub:
        - "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
        - ApiId:
            Ref: "WsgiApi"
    Export:
      Name: "dev-ctx-web-wsgi-api-domain"
  "WsgiApiEndpoint":
    Value:
      Fn::Join:
        - ""
        - - "https://api.project.com/"
  "WsgiRegionalDomainName":
    Value:
      Fn::GetAtt: "WsgiApiGatewayDomainName.RegionalDomainName"
  "WsgiRegionalHostedZoneId":
    Value:
      Fn::GetAtt: "WsgiApiGatewayDomainName.RegionalHostedZoneId"
  "MailLambdaFunction":
    Value:
      Fn::GetAtt: "MailLambdaFunction.Arn"
  "MailDeadLetterAlarmArn":
    Value:
      Fn::GetAtt: "MailDeadLetterAlarm.Arn"
