AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  # [iam] external_roles では role を作らず、事前に作られた role を名前で参照する
  # (参照は lambda_role.cfn_arn)
  LambdaRole:
    # This role must be created before the lambda function.
    # https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    # When you change Role, you must delete function and role.
    # https://www.lastweekinaws.com/blog/the-sneaky-weakness-behind-aws-managed-kms-keys/
    # 中身は pocket_cli/resources/aws/iam_roles.py の lambda_role
    Type: AWS::IAM::Role
    Properties: {"AssumeRolePolicyDocument": {"Statement": [{"Action": "sts:AssumeRole", "Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}}]}, "ManagedPolicyArns": ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole", "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole", "arn:aws:iam::aws:policy/AmazonSQSFullAccess"], "Policies": [{"PolicyDocument": {"Statement": [{"Action": ["s3:ListBucket"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}"}]}, {"Action": ["s3:DeleteObject", "s3:DeleteObjectVersion"], "Effect": "Deny", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/raw/*"}, {"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/metadata/*"}]}, {"Action": ["s3:GetObject", "s3:GetObjectVersion"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/raw/*"}, {"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/imports/*"}, {"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/metadata/*"}]}, {"Action": ["s3:PutObject"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:${AWS::Partition}:s3:::mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}/metadata/*"}]}], "Version": "2012-10-17"}, "PolicyName": "inbound-support"}, {"PolicyDocument": {"Statement": [{"Action": ["cloudformation:DescribeStacks"], "Effect": "Allow", "Resource": [{"Fn::Sub": "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mail-perm-*"}]}], "Version": "2012-10-17"}, "PolicyName": "mail-perm-pocket-access-cloudformation"}], "RoleName": "lambda-mail-perm-app-pocket"}

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "mail-perm-pocket-app-lambda"
      GroupName: "mail-perm-pocket-app-lambda"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: "mail-perm-pocket-app-lambda"
      VpcId:
        Fn::ImportValue: "main-pocket-vpc-id"

  "MailLambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "mail-perm-pocket-app-mail"
      PackageType: Image
      Architectures:
        - "x86_64"
      MemorySize: "512"
      Timeout: "30"
      Role: {"Fn::GetAtt": "LambdaRole.Arn"}
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/mail-perm-pocket-app-lambda:mail"
      ImageConfig:
        Command:
          - "app.mail"
      Environment:
        Variables:
          "POCKET_STAGE": "mail"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "app"
          POCKET_INBOUND:
            Fn::Sub: "{\"support\": {\"bucket\": \"mail-perm-pocket-inbound-support-d2efa54d05-${AWS::AccountId}\", \"import_prefix\": \"imports/\", \"metadata_prefix\": \"metadata/\", \"raw_prefix\": \"raw/\", \"recipients\": [\"support@mail.example.com\"], \"region\": \"ap-northeast-1\", \"topic_arn\": \"arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:mail-perm-pocket-inbound-support-d2efa54d05\"}}"
          "DEPLOY_HASH": "abc1234"
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: "main-pocket-private-subnet-1"
          - Fn::ImportValue: "main-pocket-private-subnet-2"



  "MailSqsQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "mail-perm-pocket-app-mail"
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: "MailDeadLetterQueue.Arn"
        maxReceiveCount: "5"
      VisibilityTimeout: "180"
      # default 4 days
      MessageRetentionPeriod: "1209600"

  "MailDeadLetterQueue":
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "mail-perm-pocket-app-mail-dead-letter"
      # max 14 days
      MessageRetentionPeriod: "1209600"


  "MailSqsEventSourceMapping":
    DependsOn:
      - "MailSqsQueue"
      - "MailLambdaFunction"
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt: "MailSqsQueue.Arn"
      FunctionName:
        Ref: "MailLambdaFunction"
      BatchSize: "10"
      ScalingConfig:
        MaximumConcurrency: "2"
      FunctionResponseTypes:
        - "ReportBatchItemFailures"



  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)

Outputs:
  "MailLambdaFunction":
    Value:
      Fn::GetAtt: "MailLambdaFunction.Arn"
