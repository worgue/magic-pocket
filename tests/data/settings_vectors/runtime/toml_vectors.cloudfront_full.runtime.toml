[general]
region = "ap-northeast-1"
project_name = "cf"
stages = ["dev", "prod"]

[s3]


[container.app]
dockerfile_path = "__runtime__"

[container.app.secrets.managed]

[container.app.secrets.managed.SIGNING_KEY]
type = "cloudfront_signing_key"

[container.app.secrets.managed.TOKEN_SECRET]
type = "spa_token_secret"

[container.app.secrets.managed.BASIC_AUTH]
type = "basic_auth_credential"

[container.app.secrets.managed.BASIC_AUTH.options]
username = "admin"

[container.app.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

[container.app.handlers.wsgi.apigateway]


[cloudfront.web]
domain = "www.example.com"
signing_key = "SIGNING_KEY"
basic_auth = "BASIC_AUTH"
enable_origin_verify = true
routes = [
    { is_default = true, is_spa = true, spa_fallback_html = "app.html", origin_path = "/spa" },
    { type = "lambda", path_pattern = "/api/*", handler = "app.wsgi" },
    { path_pattern = "/assets/*", ref = "assets", versioning = "content_hash", versioned_max_age = 3600 },
    { path_pattern = "/static/*", ref = "static", versioning = "object_hash", map = "maps/static.map", sources = [
    { name = "data", dir = "data", exclude = ["*.tmp"] },
    { name = "code", dir = "build", prefix = "app/", include = ["**/*.js"], hashed = false },
] },
    { path_pattern = "/media/*", signed = true, origin_path = "/uploads" },
    { path_pattern = "/deploy/*", versioning = "deploy_hash" },
]

[cloudfront.web.waf]
managed_rule_groups = ["AWSManagedRulesCommonRuleSet"]
allow_rules = [
    { path = "/healthz" },
    { header = "SMOKE_ALLOW" },
    { path = "/api/hook*", header = "HOOK_ALLOW" },
]
rate_limits = [
    { limit = 100 },
    { limit = 2000, window_sec = 60, action = "count", path = "/api/*" },
]

[cloudfront.admin]
routes = [
    { is_default = true, origin_path = "/admin" },
]

[cloudfront.admin.waf]
enable_ip_set = false
rate_limits = [
    { limit = 10 },
]

[prod.cloudfront]

[prod.cloudfront.admin]
routes = [
    { is_default = true, origin_path = "/admin-prod" },
]
