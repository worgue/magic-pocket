[general]
region = "ap-southeast-1"
project_name = "testprj"
stages = ["dev"]

[s3]


[container.main]
dockerfile_path = "__runtime__"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

[container.main.handlers.wsgi.apigateway]


[container.main.django.storages]

[container.main.django.storages.default]
store = "s3"
distribution = "web"
route = "media"

[container.main.django.storages.staticfiles]
store = "s3"
static = true
distribution = "web"
route = "static"

[cloudfront.web]
routes = [
    { is_default = true, is_spa = true, origin_path = "/app/spa" },
    { path_pattern = "/static/*", ref = "static", origin_path = "/app/static" },
    { path_pattern = "/media/*", ref = "media" },
]
