[general]
region = "ap-southeast-1"
project_name = "testprj"
stages = ["dev"]

[s3]


[container.main]
dockerfile_path = "__runtime__"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

[container.main.handlers.wsgi.apigateway]


[cloudfront.web]
routes = [
    { is_default = true, is_spa = true, origin_path = "/app" },
    { path_pattern = "/static/*", ref = "static", origin_path = "/static" },
]
