[general]
region = "ap-northeast-1"
stages = ["sandbox"]
project_name = "pocket-example-dsql"

[s3]


[container.main]
dockerfile_path = "__runtime__"

[container.main.handlers.wsgi]
command = "pocket-example-dsql-lambda"

[container.main.handlers.worker]
command = "pocket-example-dsql-worker"
timeout = 30

[container.main.handlers.worker.sqs.dead_letter_alert]
email = "alerts@example.com"

[container.main.handlers.mail]
command = "pocket-example-dsql-mail-worker"
timeout = 60

[container.main.handlers.mail.sqs.dead_letter_alert]
email = "alerts@example.com"

[container.main.secrets]
store = "ssm"

[container.main.secrets.managed.SECRET_KEY]
type = "password"

[container.main.secrets.managed.SECRET_KEY.options]
length = 50

[sandbox.container]

[sandbox.container.main.handlers]

[sandbox.container.main.handlers.wsgi.apigateway]


[sandbox.scheduler]

[sandbox.scheduler.schedules.daily_message]
scheduler = "pocket.sqs_scheduler"
rate = "1 day"
handler = "main.worker"

[sandbox.scheduler.schedules.daily_message.message]
type = "post_message"
note = "scheduled"

[sandbox.cloudfront]

[sandbox.cloudfront.web]
domain = "dsql.sandbox.magic-pocket.example.com"
routes = [
    { path_pattern = "/api/*", type = "lambda", handler = "main.wsgi" },
    { path_pattern = "", is_default = true, type = "s3", is_spa = true, spa_fallback_html = "200.html", origin_path = "/spa" },
]

[sandbox.iam]
external_roles = true
namespace = "myorg"

[inbound.inbox]
domain = "inbound.dsql.sandbox.magic-pocket.example.com"
recipients = ["test@inbound.dsql.sandbox.magic-pocket.example.com"]
handler = "main.mail"
retention_days = 30

[inbound.inbox.delivery_alert]
email = "alerts@example.com"

[dsql]
