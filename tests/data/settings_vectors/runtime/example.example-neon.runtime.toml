[general]
region = "ap-southeast-1"
stages = ["dev", "sandbox"]
project_name = "pocket-example-neon"

[neon]
project_name = "dev-magic-pocket"
provisioning = "command"

[sandbox.neon]
project_name = "dev-magic-pocket"
branch_name = "sandbox"

[sandbox.cloudfront]

[sandbox.cloudfront.web]
domain = "neon.sandbox.magic-pocket.example.com"
routes = [
    { type = "lambda", handler = "main.wsgi", is_default = true },
    { path_pattern = "/static/*", ref = "static", versioning = "deploy_hash", origin_path = "/static" },
]

[s3]


[container.main]
dockerfile_path = "__runtime__"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

[container.main.handlers.wsgi.apigateway]


[container.main.handlers.management]
command = "pocket.django.lambda_handlers.management_command_handler"
timeout = 600

[container.main.django.storages]

[container.main.django.storages.default]
store = "filesystem"

[container.main.django.storages.staticfiles]
store = "s3"
static = true
distribution = "web"
route = "static"

[container.main.secrets]
store = "ssm"

[container.main.secrets.managed.SECRET_KEY]
type = "password"

[container.main.secrets.managed.SECRET_KEY.options]
length = 50

[container.main.secrets.managed.DJANGO_SUPERUSER_PASSWORD]
type = "password"

[container.main.secrets.managed.DJANGO_SUPERUSER_PASSWORD.options]
length = 16

[container.main.secrets.user.DATABASE_URL]
type = "neon_database_url"
