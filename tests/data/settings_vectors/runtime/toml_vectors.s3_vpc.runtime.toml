[general]
region = "ap-northeast-1"
project_name = "s3vpc"
stages = ["dev", "prod", "shared"]

[vpc]
ref = "main"
zone_suffixes = ["a", "c"]
nat_gateway = true
internet_gateway = true
sharable = true

[s3]
bucket_name_format = "{project}-{stage}-assets"
versioning = true
lifecycle_rules = [
    { id = "tmp", prefix = "tmp/", expiration_days = 1 },
    { id = "old", prefix = "", noncurrent_version_expiration_days = 30 },
]

[s3.cors]
methods = ["GET", "PUT"]
cloudfront = "web"

[dev.vpc]
nat_gateway = false
internet_gateway = false

[prod.vpc]

[prod.vpc.efs]
local_mount_path = "/mnt/data"
access_point_path = "/app"

[prod.s3]
lifecycle_rules = [
    { id = "all", prefix = "", expiration_days = 365, noncurrent_version_expiration_days = 7 },
]

[prod.s3.cors]
methods = ["GET"]
cloudfront = ["web", "admin"]

[shared.vpc]
ref = "shared"
manage = false
sharable = false
zone_suffixes = []
