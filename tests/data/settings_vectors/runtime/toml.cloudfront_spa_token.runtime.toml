[general]
region = "ap-southeast-1"
project_name = "testprj"
stages = ["dev"]

[s3]


[container.main]
dockerfile_path = "__runtime__"

[container.main.handlers.wsgi]
command = "pocket.django.lambda_handlers.wsgi_handler"

[container.main.secrets.managed]

[container.main.secrets.managed.SECRET_KEY]
type = "password"

[container.main.secrets.managed.SECRET_KEY.options]
length = 50

[container.main.secrets.managed.SPA_TOKEN_SECRET]
type = "spa_token_secret"

[cloudfront.main]
routes = [
    { is_default = true, is_spa = true, origin_path = "/main" },
]
