name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # auto-merge 可否の判定 (依存ごとの semver 判定)。テスト実行のゲートではない。
  # 全依存が「patch (0.0.x を除く)」か「0.x でない minor」のときだけ自動マージする。
  # major / 0.x への minor (semver §4 で breaking になりうる) / 0.0.x への変更が 1 つでも
  # あれば PR 全体 (group の bundle) を人手レビューに回す。ecosystem の特例は持たない。
  # job の if は PR の作成者で見る (actor で見ると base 取り込み後に job ごと skip され、
  # just test が走らない。KN1617)。自動マージは actor が Dependabot の run だけ。
  meta:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      automerge: ${{ steps.gate.outputs.automerge }}
    steps:
      - uses: dependabot/fetch-metadata@v3
        if: github.actor == 'dependabot[bot]'
        id: meta
      # 版が取れない依存が 1 つでもあれば false (人手)。人が起こした run (base 取り込み後) は
      # step ごと skip され output が空 = false。
      - name: gate (per-dependency semver)
        if: github.actor == 'dependabot[bot]'
        id: gate
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          echo "$DEPS" | jq -c '.[] | {dependencyName, updateType, prevVersion, newVersion, dependencyGroup}' || true
          ok=$(jq -r '
            def ver: (.newVersion // .prevVersion // "") | ltrimstr("v");
            def zero_x: ver | test("^0\\.");
            def zero_zero: ver | test("^0\\.0(\\.|$)");
            if type != "array" or length == 0 then false
            else all(.[]; ver != "" and (
              (.updateType == "version-update:semver-patch" and (zero_zero | not))
              or (.updateType == "version-update:semver-minor" and (zero_x | not))))
            end' <<<"$DEPS") || ok=false
          [ "$ok" = "true" ] || ok=false
          echo "automerge=$ok" | tee -a "$GITHUB_OUTPUT"

  # 全 Dependabot PR で lint (ruff / pyright / clippy) と just test (pytest + cargo test) を
  # 回す (job の if でゲートしない — skip の緑は「未検証」を成功に見せる)。merge だけ
  # automerge 判定で分岐する。
  # branch protection に依存せず workflow 内で検証する。
  test-and-merge:
    needs: meta
    runs-on: ubuntu-latest
    env:
      # .cargo/config.toml の `jobs = 2` は開発用 VM の保護用。runner では上限を外す
      CARGO_BUILD_JOBS: default
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # clippy は components を指定しないと入らない (test.yml と同じ)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # test.yml と cache を共有する (dev で保存した cache を Dependabot PR が使う)。
      # PR では保存しない (PR ごとの cache が repo の上限を食い dev の cache を追い出すため)
      - uses: Swatinem/rust-cache@v2
        with:
          # test.yml と揃える
          prefix-key: v1-rust
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      # lint ツール自身の更新 (ruff / pyright) や依存の deprecation は、test を通して lint だけ
      # 壊す。commit 時の pre-commit は Dependabot の merge では走らないので、ここを関門にする
      - run: just lint
      - run: just typecheck
      - run: just lint-rust
      - run: just test
      # --- 以下 merge は automerge=true (major / 0.x の minor を含まない PR) のときだけ ---
      # App token でマージ (GITHUB_TOKEN だと後続 workflow を起動しないため)。
      # app-id は直書き (Dependabot トリガの run では Actions vars が見えない。App ID は公開情報)。
      # private-key は Dependabot secret (Actions secret も Dependabot run では見えない)。
      - uses: actions/create-github-app-token@v3
        if: needs.meta.outputs.automerge == 'true'
        id: app-token
        with:
          app-id: "3993238" # auto-merge 用 GitHub App
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Squash merge (tests passed)
        if: needs.meta.outputs.automerge == 'true'
        # 同時に開いた PR が並行で merge されると base が動いた直後の merge を GitHub が
        # 「Base branch was modified. Review and try the merge again.」で一時的に拒否する
        # (KN1689: security update 4 件同時で 1 件が open のまま 17 時間滞留)。
        # workflow は pull_request でしか走らず自動では再試行されないので、ここで待って
        # 再試行する。lock が本当に競合したときは再試行でも失敗し、Dependabot の rebase で
        # workflow が走り直す (従来どおり)
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --squash "$PR_URL" && exit 0
            echo "merge failed (attempt $i); retrying in 20s" >&2
            sleep 20
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
