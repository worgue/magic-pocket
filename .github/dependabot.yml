version: 2
updates:
  - package-ecosystem: uv # Python (pyproject.toml / uv.lock を直接更新)
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: cargo # Rust (pocket-rs)。group を patch / minor で分割する
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-patch: # auto-merge 対象 (従来どおり束ねる)
        update-types: [patch]
      rust-minor: # auto-merge されず人手 (0.x minor = breaking。組織標準「cargo は minor も人手」)
        update-types: [minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
