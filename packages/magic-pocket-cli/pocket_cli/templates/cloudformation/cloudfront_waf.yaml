AWSTemplateFormatVersion: "2010-09-09"
Description: WAFv2 IPSet + WebACL for CloudFront (us-east-1)

# Notes:
# - Scope=CLOUDFRONT requires us-east-1.
# - waf.enable_ip_set = true (default):
#   - DefaultAction = Block
#   - IPSet (Addresses=[]) + ip-allow Rule (Allow on IPSet match) を出力
#   - 初回 deploy 直後は deny-all。`pocket waf ip add self ...` で CIDR を投入
#   - IPSet の Addresses は CFn template 上は常に空で、CLI が side-channel
#     更新する仕様 (CFn 視点では常に drift だが意図的)
# - waf.enable_ip_set = false:
#   - DefaultAction = Allow
#   - IPSet / ip-allow Rule は出力しない
#   - managed_rule_groups (必須) で「許可ベース + 怪しいリクエストのみ block」
# - waf.allow_rules:
#   - IPSet / managed rules より先 (priority 0..n-1) に評価される allow
#   - header rule の SearchString は managed secret 値の焼き込み
#     (enable_origin_verify の OriginCustomHeaders と同じ exposure class)

Resources:
  # {% if waf.enable_ip_set %}
  IPSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: "{{ slug }}-waf-allow"
      Description: "CloudFront IP allowlist - managed by pocket waf ip CLI"
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: []
      Tags:
        - Key: Name
          Value: "{{ resource_prefix }}cloudfront-waf-allow"
  # {% endif %}

  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: "{{ slug }}-waf"
      Description: "CloudFront WAF - IP allowlist plus optional managed rules"
      Scope: CLOUDFRONT
      DefaultAction:
        # {% if waf.enable_ip_set %}
        Block: {}
        # {% else %}
        Allow: {}
        # {% endif %}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: "{{ slug }}-waf"
      Rules:
        # {% for rule in waf.allow_rules %}
        - Name: "allow-{{ loop.index0 }}"
          Priority: {{ loop.index0 }}
          Action:
            Allow: {}
          Statement:
            # {% if rule.path and rule.header %}
            AndStatement:
              Statements:
                - ByteMatchStatement:
                    FieldToMatch:
                      UriPath: {}
                    PositionalConstraint: "{{ rule.path_positional_constraint }}"
                    SearchString: "{{ rule.path_search_string }}"
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
                - ByteMatchStatement:
                    FieldToMatch:
                      SingleHeader:
                        Name: x-pocket-waf-allow
                    PositionalConstraint: EXACTLY
                    SearchString: "{{ allow_secret_values.get(rule.header, '') }}"
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
            # {% elif rule.path %}
            ByteMatchStatement:
              FieldToMatch:
                UriPath: {}
              PositionalConstraint: "{{ rule.path_positional_constraint }}"
              SearchString: "{{ rule.path_search_string }}"
              TextTransformations:
                - Priority: 0
                  Type: NONE
            # {% else %}
            ByteMatchStatement:
              FieldToMatch:
                SingleHeader:
                  Name: x-pocket-waf-allow
              PositionalConstraint: EXACTLY
              SearchString: "{{ allow_secret_values.get(rule.header, '') }}"
              TextTransformations:
                - Priority: 0
                  Type: NONE
            # {% endif %}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "{{ slug }}-waf-allow-{{ loop.index0 }}"
        # {% endfor %}
        # {% set priority_offset = waf.allow_rules|length %}
        # {% if waf.enable_ip_set %}
        - Name: ip-allow
          Priority: {{ priority_offset }}
          Action:
            Allow: {}
          Statement:
            IPSetReferenceStatement:
              Arn:
                Fn::GetAtt: IPSet.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "{{ slug }}-waf-ip-allow"
        # {% endif %}
        # {% for group_name in waf.managed_rule_groups %}
        - Name: "managed-{{ loop.index0 }}-{{ group_name }}"
          Priority: {{ priority_offset + (loop.index if waf.enable_ip_set else loop.index0) }}
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: "{{ group_name }}"
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "{{ slug }}-waf-managed-{{ loop.index0 }}"
        # {% endfor %}
      Tags:
        - Key: Name
          Value: "{{ resource_prefix }}cloudfront-waf"

Outputs:
  WebACLArn:
    Value:
      Fn::GetAtt: WebACL.Arn
  # {% if waf.enable_ip_set %}
  IPSetArn:
    Value:
      Fn::GetAtt: IPSet.Arn
  # AWS::WAFv2::IPSet の Ref は "<Name>|<UUID>|<Scope>" の合成 string を返す。
  # WAFv2 API (GetIPSet / UpdateIPSet) は UUID 単体 (36 char) を要求するので、
  # ここでは Fn::GetAtt の Id (= UUID) を使う必要がある。
  IPSetId:
    Value:
      Fn::GetAtt: IPSet.Id
  IPSetName:
    Value: "{{ slug }}-waf-allow"
  # {% endif %}
