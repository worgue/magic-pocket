AWSTemplateFormatVersion: "2010-09-09"
Description: lambda configuration for webapp

Resources:
  LambdaRole:
    # This role must be created before the lambda function.
    # https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    # When you change Role, you must delete function and role.
    # https://www.lastweekinaws.com/blog/the-sneaky-weakness-behind-aws-managed-kms-keys/
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # {% if vpc %}
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        # {% endif %}
        # {% if use_ses %}
        - arn:aws:iam::aws:policy/AmazonSESFullAccess
        # {% endif %}
        # {% if use_s3 %}
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        # {% endif %}
        # {% if use_route53 %}
        - arn:aws:iam::aws:policy/AmazonRoute53FullAccess
        # {% endif %}
        # {% if use_sqs %}
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        # {% endif %}
        # {% if use_efs %}
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemFullAccess
        # {% endif %}
        # {% for arn in iam.managed_policy_arns %}
        - "{{ arn }}"
        # {% endfor %}
      Policies:
        # {# allowed_*_resources は container store + shared store の合算 #}
        # {% for inlet in inbound.values() %}
        - PolicyName: "inbound-{{ inlet.name }}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:ListBucket"]
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}"
              - Effect: Deny
                Action: ["s3:DeleteObject", "s3:DeleteObjectVersion"]
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.raw_prefix }}*"
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.metadata_prefix }}*"
              - Effect: Allow
                Action: ["s3:GetObject", "s3:GetObjectVersion"]
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.raw_prefix }}*"
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.import_prefix }}*"
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.metadata_prefix }}*"
              - Effect: Allow
                Action: ["s3:PutObject"]
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::{{ inlet.bucket_name }}/{{ inlet.config.metadata_prefix }}*"
        # {% endfor %}
        # {% if allowed_sm_resources %}
        - PolicyName: "{{ resource_prefix }}access-secretsmanager"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource:
                  # {% for value in allowed_sm_resources %}
                  - Fn::Sub: "{{ value }}"
                  # {% endfor %}
              # {% if require_list_secrets %}
              - Effect: "Allow"
                Action:
                  - "secretsmanager:ListSecrets"
                Resource:
                  - "*"
              # {% endif %}
        # {% endif %}
        # {% if allowed_ssm_resources %}
        - PolicyName: "{{ resource_prefix }}access-ssm"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                  - "ssm:GetParametersByPath"
                Resource:
                  # {% for value in allowed_ssm_resources %}
                  - Fn::Sub: "{{ value }}"
                  # {% endfor %}
        # {% endif %}
        # {% if rds_secret_arn %}
        - PolicyName: "{{ resource_prefix }}access-rds-secret"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource:
                  - "{{ rds_secret_arn }}"
              # {% if rds_kms_key_id %}
              - Effect: "Allow"
                Action:
                  - "kms:Decrypt"
                Resource:
                  - "{{ rds_kms_key_id }}"
              # {% endif %}
        # {% endif %}
        # {% if rds_ssm_param_arn %}
        - PolicyName: "{{ resource_prefix }}access-rds-ssm"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ssm:GetParameter"
                Resource:
                  - Fn::Sub: "{{ rds_ssm_param_arn }}"
        # {% endif %}
        # {% if use_dsql %}
        - PolicyName: "{{ resource_prefix }}access-dsql"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "dsql:DbConnectAdmin"
                Resource:
                  - "{{ dsql_cluster_arn }}"
        # {% endif %}
        - PolicyName:
            Fn::Sub: "{{ resource_prefix }}access-cloudformation"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "cloudformation:DescribeStacks"
                Resource:
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/{{ slug }}-*"
        # {% for policy_name, doc in iam.inline_policies.items() %}
        - PolicyName: "{{ resource_prefix }}{{ policy_name }}"
          PolicyDocument: {{ doc | tojson }}
        # {% endfor %}
      RoleName: "lambda-{{ slug }}-{{ name }}-{{ namespace }}"
      # {% if permissions_boundary %}
      PermissionsBoundary: "{{ permissions_boundary }}"
      # {% endif %}

  # {% if vpc %}
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "{{ resource_prefix }}{{ name }}-lambda"
      GroupName: "{{ resource_prefix }}{{ name }}-lambda"
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value: "{{ resource_prefix }}{{ name }}-lambda"
      VpcId:
        Fn::ImportValue: "{{ export.vpc_id }}"
  # {% endif %}

  # {% for handler in handlers.values() %}
  "{{ handler.key|capitalize }}LambdaFunction":
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "{{ handler.function_name }}"
      PackageType: Image
      Architectures:
        - "{{ lambda_architecture }}"
      MemorySize: "{{ handler.memory_size }}"
      Timeout: "{{ handler.timeout }}"
      # {% if handler.reserved_concurrency %}
      ReservedConcurrentExecutions: "{{ handler.reserved_concurrency }}"
      # {% endif %}
      Role:
        Fn::GetAtt: LambdaRole.Arn
      Code:
        ImageUri:
          Fn::Sub: "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/{{ ecr_name }}:{{ stage }}"
      ImageConfig:
        Command:
          - "{{ handler.command }}"
      Environment:
        Variables:
          "POCKET_STAGE": "{{ stage }}"
          # runtime が自分の [container.<name>] を選択するための識別子
          "POCKET_CONTAINER": "{{ name }}"
          # {% if inbound %}
          POCKET_INBOUND:
            Fn::Sub: {{ inbound_runtime_config | tojson | tojson }}
          # {% endif %}
          # {# tojson で YAML セーフに埋め込む (値内の二重引用符等で ParserError にしない)。
          #    container 共通 envs に handler.envs をマージし handler 側を優先する。
          #    重複キーを 2 回出さないよう共通側は handler.envs にあるキーをスキップ #}
          # {% for env_key, value in envs.items() %}
          # {% if env_key not in handler.envs %}
          {{ env_key | tojson }}: {{ value | tojson }}
          # {% endif %}
          # {% endfor %}
          # {% for env_key, value in handler.envs.items() %}
          {{ env_key | tojson }}: {{ value | tojson }}
          # {% endfor %}
          # {% for env_key, import_name in signing_key_imports.items() %}
          "{{ env_key }}":
            Fn::ImportValue: "{{ import_name }}"
          # {% endfor %}
          # {% if rds_secret_arn %}
          "POCKET_RDS_SECRET_ARN": "{{ rds_secret_arn }}"
          "POCKET_RDS_ENDPOINT": "{{ rds_endpoint }}"
          "POCKET_RDS_PORT": "{{ rds_port }}"
          "POCKET_RDS_DBNAME": "{{ rds_dbname }}"
          # {% endif %}
          # {% if rds_ssm_param_name %}
          "POCKET_RDS_SECRET_STORE": "ssm"
          "POCKET_RDS_SSM_PARAM": "{{ rds_ssm_param_name }}"
          "POCKET_RDS_ENDPOINT": "{{ rds_endpoint }}"
          "POCKET_RDS_PORT": "{{ rds_port }}"
          "POCKET_RDS_DBNAME": "{{ rds_dbname }}"
          # {% endif %}
          # {% if use_dsql %}
          "POCKET_DSQL_ENDPOINT": "{{ dsql_endpoint }}"
          "POCKET_DSQL_REGION": "{{ dsql_region }}"
          # {% endif %}
      # {% if vpc %}
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroup
        SubnetIds:
          # {% for zone in vpc.zones %}
          - Fn::ImportValue: "{{ export.private_subnet_ }}{{ loop.index }}"
          # {% endfor %}
      # {% endif %}
      # {% if use_efs %}
      FileSystemConfigs:
        - Arn:
            Fn::ImportValue: "{{ export.efs_access_point_arn }}"
          LocalMountPath: "{{ efs_local_mount_path }}"
      # {% endif %}
  # {% endfor %}

  # {% for handler in handlers.values() %}
  # {% if handler.apigateway %}
  "{{ handler.key|capitalize }}ApigatewayCloudWatchLogsGroup":
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "{{ slug }}-{{ name }}-{{ handler.key }}-apigateway"
      RetentionInDays: 365

  "{{ handler.key|capitalize }}Api":
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: "{{ slug }}-{{ name }}-{{ handler.key }}"
      ProtocolType: HTTP
      Target:
        Fn::GetAtt: "{{ handler.key|capitalize }}LambdaFunction.Arn"
      DisableExecuteApiEndpoint: "{{ handler.apigateway.disable_execute_api_endpoint }}"

  "{{ handler.key|capitalize }}ApiGatewayManagedOverrides":
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId:
        Ref: "{{ handler.key|capitalize }}Api"
      Stage:
        AutoDeploy: true
        AccessLogSettings:
          DestinationArn:
            Fn::GetAtt: "{{ handler.key|capitalize }}ApigatewayCloudWatchLogsGroup.Arn"
          Format: >-
            {"requestTime": "$context.requestTime",
            "requestId": "$context.requestId",
            "httpMethod": "$context.httpMethod",
            "path": "$context.path",
            "routeKey": "$context.routeKey",
            "status": $context.status,
            "responseLatency": $context.responseLatency,
            "integrationRequestId": "$context.integration.requestId",
            "functionResponseStatus": "$context.integration.status",
            "integrationLatency": "$context.integration.latency",
            "integrationServiceStatus": "$context.integration.integrationStatus",
            "integrationErrorMessage": "$context.integrationErrorMessage",
            "ip": "$context.identity.sourceIp",
            "userAgent": "$context.identity.userAgent"}

  "{{ handler.key|capitalize }}Route":
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - "{{ handler.key|capitalize }}Integration"
    Properties:
      ApiId:
        Ref: "{{ handler.key|capitalize }}Api"
      RouteKey: "ANY /{proxy+}"
      Target:
        Fn::Join:
          - /
          - - integrations
            - Ref: "{{ handler.key|capitalize }}Integration"

  "{{ handler.key|capitalize }}Integration":
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: "{{ handler.key|capitalize }}Api"
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":apigateway:"
            - Ref: "AWS::Region"
            - ":lambda:path/2015-03-31/functions/"
            - Fn::GetAtt: "{{ handler.key|capitalize }}LambdaFunction.Arn"
            - /invocations
      PayloadFormatVersion: "2.0"

  "{{ handler.key|capitalize }}Permission":
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: "{{ handler.key|capitalize }}LambdaFunction"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Join:
          - ""
          - - "arn:"
            - Ref: "AWS::Partition"
            - ":execute-api:"
            - Ref: "AWS::Region"
            - ":"
            - Ref: "AWS::AccountId"
            - ":"
            - Ref: "{{ handler.key|capitalize }}Api"
            - "/*/*"
  # {% endif %}

  # {% if handler.apigateway.domain %}
  "{{ handler.cloudformation_cert_ref_name }}":
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: "{{ handler.apigateway.domain }}"
      # {% if handler.apigateway.create_records %}
      DomainValidationOptions:
        - DomainName: "{{ handler.apigateway.domain }}"
          HostedZoneId: "{{ handler.apigateway.hosted_zone_id }}"
      # {% endif %}
      Tags:
        - Key: Name
          Value: "{{ slug }}-{{ name }}-{{ handler.key }}-cert"
      ValidationMethod: DNS

  ##### Warning #####
  # Api Gateway does not support http, so you must use http.
  # Moreover you can not just redirect http to https.
  #  - https://stackoverflow.com/a/58683733
  #  - https://stackoverflow.com/q/47311081
  ###################
  "{{ handler.key|capitalize }}ApiGatewayDomainName":
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: "{{ handler.apigateway.domain }}"
      DomainNameConfigurations:
        - CertificateArn:
            Ref: "{{ handler.cloudformation_cert_ref_name }}"

  # {% if handler.apigateway.create_records %}
  "{{ handler.key|capitalize }}DNSRecord":
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: "{{ handler.apigateway.hosted_zone_id }}"
      Name: "{{ handler.apigateway.domain }}"
      Type: A
      AliasTarget:
        HostedZoneId:
          Fn::GetAtt: "{{ handler.key|capitalize }}ApiGatewayDomainName.RegionalHostedZoneId"
        DNSName:
          Fn::GetAtt: "{{ handler.key|capitalize }}ApiGatewayDomainName.RegionalDomainName"
  # {% endif %}

  "{{ handler.key|capitalize }}ApiGatewayApiMapping":
    DependsOn:
      - "{{ handler.key|capitalize }}ApiGatewayDomainName"
    Type: "AWS::ApiGatewayV2::ApiMapping"
    Properties:
      DomainName: "{{ handler.apigateway.domain }}"
      ApiId:
        Ref: "{{ handler.key|capitalize }}Api"
      Stage: "$default"
  # {% endif %}
  # {% endfor %}

  # {% for handler in handlers.values() %}
  # {% if handler.sqs %}
  "{{ handler.key|capitalize }}SqsQueue":
    Type: AWS::SQS::Queue
    # {% if handler.sqs.retain %}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # {% endif %}
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "{{ handler.sqs.name }}"
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: "{{ handler.key|capitalize }}DeadLetterQueue.Arn"
        maxReceiveCount: "{{ handler.sqs.dead_letter_max_receive_count }}"
      VisibilityTimeout: "{{ handler.sqs.visibility_timeout }}"
      # default 4 days
      MessageRetentionPeriod: "{{ handler.sqs.message_retention_period }}"

  "{{ handler.key|capitalize }}DeadLetterQueue":
    Type: AWS::SQS::Queue
    # {% if handler.sqs.retain %}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # {% endif %}
    Properties:
      SqsManagedSseEnabled: true
      QueueName:
        Fn::Sub: "{{ handler.sqs.name }}-dead-letter"
      # max 14 days
      MessageRetentionPeriod: "{{ handler.sqs.dead_letter_message_retention_period }}"

  # {% if handler.sqs.dead_letter_alert %}
  # DLQ 到達の通知 (dead_letter_alert 宣言時のみ)。email 購読は宛先が確認メールの
  # リンクを踏むまで PendingConfirmation のままで通知が届かない点に注意
  # (deploy 後の購読状態チェックと pocket status で可視化する)
  # {% if handler.sqs.dead_letter_alert.email %}
  "{{ handler.key|capitalize }}DeadLetterAlertTopic":
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "{{ handler.sqs.dead_letter_alert.topic_name }}"

  "{{ handler.key|capitalize }}DeadLetterAlertSubscription":
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: "{{ handler.key|capitalize }}DeadLetterAlertTopic"
      Protocol: email
      Endpoint: "{{ handler.sqs.dead_letter_alert.email }}"

  # {% endif %}
  "{{ handler.key|capitalize }}DeadLetterAlarm":
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "{{ handler.sqs.dead_letter_alert.alarm_name }}"
      AlarmDescription: "Messages arrived in the dead-letter queue of {{ handler.sqs.name }}"
      Namespace: "AWS/SQS"
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt: "{{ handler.key|capitalize }}DeadLetterQueue.QueueName"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # DLQ が空の間はメトリクス欠測になりうるため、欠測 = 正常として扱う
      TreatMissingData: notBreaching
      # {% if handler.sqs.dead_letter_alert.email %}
      AlarmActions:
        - Ref: "{{ handler.key|capitalize }}DeadLetterAlertTopic"
      # 復旧 (redrive / purge で DLQ が空に戻った) も通知する
      OKActions:
        - Ref: "{{ handler.key|capitalize }}DeadLetterAlertTopic"
      # {% endif %}
  # {% endif %}

  "{{ handler.key|capitalize }}SqsEventSourceMapping":
    DependsOn:
      - "{{ handler.key|capitalize }}SqsQueue"
      - "{{ handler.key|capitalize }}LambdaFunction"
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt: "{{ handler.key|capitalize }}SqsQueue.Arn"
      FunctionName:
        Ref: "{{ handler.key|capitalize }}LambdaFunction"
      BatchSize: "{{ handler.sqs.batch_size }}"
      ScalingConfig:
        MaximumConcurrency: "{{ handler.sqs.maximum_concurrency }}"
      # {% if handler.sqs.report_batch_item_failures %}
      FunctionResponseTypes:
        - "ReportBatchItemFailures"
      # {% endif %}
  # {% endif %}
  # {% endfor %}

  # {% if scheduler and scheduler.has_schedules %}
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "{{ scheduler.role_name }}"
      # {% if permissions_boundary %}
      # boundary 強制 account (iam:CreateRole が boundary 付きのみ許可) では
      # LambdaRole と同様に boundary が無いと作成できない
      PermissionsBoundary: "{{ permissions_boundary }}"
      # {% endif %}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: invoke-handlers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # {% if scheduler.invoked_function_arns %}
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                Resource:
                  # {% for arn in scheduler.invoked_function_arns %}
                  - Fn::Sub: "{{ arn }}"
                  # {% endfor %}
              # {% endif %}
              # {% if scheduler.sqs_queue_logical_names %}
              - Effect: Allow
                Action:
                  - "sqs:SendMessage"
                Resource:
                  # {% for queue_logical_name in scheduler.sqs_queue_logical_names %}
                  - Fn::GetAtt: "{{ queue_logical_name }}.Arn"
                  # {% endfor %}
              # {% endif %}

  # {% for entry in scheduler.schedules %}
  "{{ entry.yaml_key }}Schedule":
    Type: AWS::Scheduler::Schedule
    DependsOn:
      # {% if entry.is_sqs %}
      - "{{ entry.handler|capitalize }}SqsQueue"
      # {% else %}
      - "{{ entry.handler|capitalize }}LambdaFunction"
      # {% endif %}
      - SchedulerExecutionRole
    Properties:
      Name: "{{ entry.name }}"
      ScheduleExpression: "{{ entry.schedule_expression }}"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        # {% if entry.is_sqs %}
        # SQS universal target: Input が MessageBody として送信される
        Arn:
          Fn::GetAtt: "{{ entry.handler|capitalize }}SqsQueue.Arn"
        # {% else %}
        Arn:
          Fn::GetAtt: "{{ entry.handler|capitalize }}LambdaFunction.Arn"
        # {% endif %}
        RoleArn:
          Fn::GetAtt: SchedulerExecutionRole.Arn
        Input: {{ entry.input_json|tojson }}
  # {% endfor %}
  # {% endif %}

  # {% if use_efs %}
  LambdaEFSAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: "{{ export.efs_security_group }}"
      SourceSecurityGroupId:
        Ref: LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
  # {% endif %}

  # VPC 外 Lambda (use_vpc=false) には LambdaSecurityGroup が無く、RDS SG への
  # ingress も張れない (そもそも private subnet の RDS に到達できない)。
  # use_rds だけで囲むと未定義参照で CreateStack の validation に落ちる (KN1352)
  # {% if use_rds and vpc %}
  LambdaRDSAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: "{{ rds_security_group_id }}"
      SourceSecurityGroupId:
        Ref: LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  # {% endif %}

# {% if handlers %}
Outputs:
  # {% for handler in handlers.values() %}
  "{{ handler.key|capitalize }}LambdaFunction":
    Value:
      Fn::GetAtt: "{{ handler.key|capitalize }}LambdaFunction.Arn"
  # {% if handler.sqs and handler.sqs.dead_letter_alert %}
  "{{ handler.key|capitalize }}DeadLetterAlarmArn":
    Value:
      Fn::GetAtt: "{{ handler.key|capitalize }}DeadLetterAlarm.Arn"
  # {% endif %}
  # {% if handler.export_api_domain %}
  "{{ handler.key|capitalize }}ApiDomain":
    Value:
      Fn::Sub:
        - "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
        - ApiId:
            Ref: "{{ handler.key|capitalize }}Api"
    Export:
      Name: "{{ handler.export_api_domain }}"
  # {% endif %}
  # {% if handler.apigateway %}
  "{{ handler.key|capitalize }}ApiEndpoint":
    Value:
      # {% if handler.apigateway.domain %}
      Fn::Join:
        - ""
        - - "https://{{ handler.apigateway.domain }}/"
      # {% else %}
      Fn::GetAtt: "{{ handler.key|capitalize }}Api.ApiEndpoint"
      # {% endif %}
  # {% if handler.apigateway.domain %}
  "{{ handler.key|capitalize }}RegionalDomainName":
    Value:
      Fn::GetAtt: "{{ handler.key|capitalize }}ApiGatewayDomainName.RegionalDomainName"
  "{{ handler.key|capitalize }}RegionalHostedZoneId":
    Value:
      Fn::GetAtt: "{{ handler.key|capitalize }}ApiGatewayDomainName.RegionalHostedZoneId"
  # {% endif %}
  # {% endif %}
  # {% endfor %}
# {% endif %}
