[package]
name = "magic-pocket-cli-rs"
version = "0.48.0"
edition = "2021"
description = "magic-pocket の Rust 版 CLI (static 系・settings・context・version・build・status・deploy・promote・destroy)"
publish = false

# bin 名は `pocket-rs`。Python の `pocket` と両立させる期間は別名で配る。
# 全面移行後に `pocket` へ rename する
[[bin]]
name = "pocket-rs"
path = "src/main.rs"

[features]
# aws-sdk-ec2 は rustc 1 個で約 3GB を使い、メモリ上限が約 4GB の開発用 VM ではコンパイルが
# 終わらない (落ちずに止まる)。VM の中のビルドだけ `--no-default-features` で外せるよう
# feature の後ろに置く (justfile のレシピが切り替える)。素の `cargo build`・CI・release は
# ec2 込み。EC2 を呼ぶコードは `src/ec2.rs` に集める
default = ["ec2"]
ec2 = ["dep:aws-sdk-ec2"]

[dependencies]
# runtime lib。pocket.toml の読み込み (StaticConfig) と key 名 / URL encode / 論理 path
# の検査を共有する (導出を 1 か所に保つ)。CLI 用の依存は lib に足さない。
# inbound: 受信 ID の導出 (`pocket-rs resource inbound reconcile`)
magic-pocket-rs = { path = "../pocket-rs", features = ["static", "inbound"] }
# pocket.toml の設定モデル (`pocket-rs settings`)
magic-pocket-settings = { path = "../pocket-settings", features = ["context"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# aws-sdk-* は default の `rustls` feature が legacy TLS スタックを依存ツリーに残すため
# 外す (lib と同じ方針)
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# `pocket-rs context` の外部入力 (hosted zone の一覧 / managed secret の ARN)
aws-sdk-route53 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: `pocket static status` の JSON を Python (dict の挿入順) と同じ並びで出す
serde_json = { version = "1", features = ["preserve_order"] }
# sources の include / exclude (gitignore 風。Python 側は pathspec)
ignore = "0.4"
# PutObject の Content-Type (旧 Python 版は mimetypes)
mime_guess = "2"
# `pocket-rs build` (ECR repository / 認証 token、CodeBuild backend の project・role・
# account id)
aws-sdk-ecr = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-codebuild = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# CodeBuild backend の source zip (deflate は既存の flate2 を使う)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# source zip の一時置き場
tempfile = "3"
# CloudFormation template の描画 (Python 版と同じ Jinja2 の template を使う)。
# preserve_order: dict の反復順を Python (挿入順) に合わせる
minijinja = { version = "3.1.0", features = ["preserve_order", "serde"] }
# template が使う Python のメソッド (`.items()` / `.values()` / `.get()`)
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
# stack の作成・更新・削除と状態の取得 (deploy / status / destroy)
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# `pocket-rs status` が読むリソース (Lambda / RDS / security group / EFS / DSQL /
# SES の rule set / SNS の購読 / SSM)
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-efs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dsql = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ses = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# CloudFront の CreateInvalidation を呼ぶ HTTP client。TLS は aws-sdk と同じ rustls を使う
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# managed secret の生成 (乱数と RSA の鍵対)。aws-sdk の TLS (rustls) が使っているのと同じ
# 暗号ライブラリを直接使う (依存ツリーは増えない)
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
# 外部 VPC の stack に consumer のタグを付ける (deploy)
aws-sdk-resourcegroupstagging = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# deploy 済みの template と新しい template の比較 (ACM の手動対応が要るかの判定)
serde_yaml_ng = "0.10"
# CloudFront の KVS に token_secret / basic 認証の値を書く (deploy)。SigV4A の署名が要る
aws-sdk-cloudfrontkeyvaluestore = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
# CloudFront の CreateInvalidation を署名した HTTP で呼ぶ (aws-sdk-cloudfront は rustc が
# 2.4GB を使い、使う API はこれ 1 つなので SDK を足さない)。aws-sdk が使っている crate
aws-sigv4 = "1"
# AWS Backup の vault / plan / selection (deploy)。rustc の最大メモリは約 1.6GB
aws-sdk-backup = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# inbound: 受信ドメインの検証状態 (SESv2 の identity) と、削除の前の queue の滞留 (SQS)。
# rustc の最大メモリは sesv2 が約 1.3GB (sqs は runtime lib が既に使っている)
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# destroy: Lambda が自動で作った log group を消す
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# `pocket-rs waf` (IPSet の読み書きと rate rule の managed keys)。rustc の最大メモリは約 1.0GB
aws-sdk-wafv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
