[package]
name = "magic-pocket-settings"
version = "0.1.0"
edition = "2021"
description = "pocket.toml の設定モデル (Python の pocket.settings と同じ解釈)"
publish = false

# AWS SDK・tracing は入れない (runtime lib と CLI の両方から使う純粋な設定モデル)
[dependencies]
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# pydantic の Field(pattern=...) と 1 対 1 で見比べられるように regex で照合する
regex = "1"
# deserialize エラーの path (どの field か) を Python のエラーと比べるため
serde_path_to_error = "0.1"
