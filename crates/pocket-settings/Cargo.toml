[package]
name = "magic-pocket-settings"
version = "0.1.0"
edition = "2021"
description = "pocket.toml の設定モデル (Python の pocket.settings と同じ解釈)"
publish = false

# AWS SDK・tracing は入れない (runtime lib と CLI の両方から使う純粋な設定モデル)
[dependencies]
toml = { version = "1.1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Context の input_json (Python の json.dumps) を dict の挿入順で出す
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# pydantic の Field(pattern=...) と 1 対 1 で見比べられるように regex で照合する
regex = "1"
# deserialize エラーの path (どの field か) を Python のエラーと比べるため
serde_path_to_error = "0.1"
# Context (`pocket-rs context`) の受信口の命名 (Python の hashlib.sha256)。runtime lib
# (crates/pocket-rs) は Context を使わないので feature で切り離す
sha2 = { version = "0.11", optional = true }

[features]
# pocket.context の移植 (CLI だけが有効にする)
context = ["dep:sha2"]

[dev-dependencies]
# Context の vector テスト (tests/context_vectors.rs) 用に自身の context feature を有効にする
magic-pocket-settings = { path = ".", features = ["context"] }
