[package]
name = "pocket-example-dsql"
version = "0.1.0"
edition = "2021"
default-run = "pocket-example-dsql-server"

[[bin]]
name = "pocket-example-dsql-server"
path = "src/bin/main.rs"

[[bin]]
name = "pocket-example-dsql-lambda"
path = "src/bin/lambda.rs"

[[bin]]
name = "pocket-example-dsql-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "pocket-example-dsql-mail-worker"
path = "src/bin/mail_worker.rs"

[[bin]]
name = "schema-apply"
path = "src/bin/schema_apply.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",   # rustls を使う (native-tls ではない)
    "with-uuid",
    "with-chrono",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lambda_http = "0.15"
# lambda_http 0.15 が内部で使う版に揃える (LambdaEvent 等の型を共有するため)
lambda_runtime = "0.14"
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["sqs"] }
chrono = "0.4"
# inbound (SES 受信 worker ヘルパ) は feature で有効化する
magic-pocket-rs = { git = "https://github.com/worgue/magic-pocket.git", tag = "0.37.0", features = ["inbound"] }
# 受信メールの MIME 解析 (件名 / From の取り出し)。本文・添付は信頼できない入力
mail-parser = "0.11"
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
# aws-sdk-* は default の `rustls` feature が legacy TLS スタック (rustls 0.21 系 →
# 脆弱な rustls-webpki 0.101.x) を依存ツリーに残すため外す。Cargo の feature は依存全体で
# 合算されるので、1 箇所でも default のままだと利用側では外せない
aws-sdk-dsql = { version = "1.65.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.5.0"
urlencoding = "2.1.3"
anyhow = "1.0.104"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# pocket.toml の schedule message を読んで Job 型と突き合わせる (tests/jobs.rs)
toml = "1"
http-body-util = "0.1"

# --- VM ビルド標準 (dev profile) — 外さないこと ---
# full debuginfo の target 肥大とリンク時メモリスパイクで forge VM が落ちるため、
# 自コードは行番号のみ・依存クレートは debuginfo なしに削減する。
# gdb/lldb で変数ステップ実行が必要なときだけ一時的に debug = true へ戻す。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
