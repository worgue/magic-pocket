# 重い検査 (semgrep / clippy / pytest) は CI の test workflow に置く (pre-push に置かない)。
# pre-push で走るのは .git/hooks 直置きの gitleaks (scan-leaks) だけ
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ".*\\.css\\.map|.*\\.svg"
      - id: check-yaml
        exclude: "mkdocs.yml|pocket_cli/templates/cloudformation/.*\\.yaml"
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        exclude: "pocket/templates/init/django-settings.py"
  - repo: local
    hooks:
      # Rust の整形ゲート (rustfmt 既定設定)。数秒なので pre-commit 側
      - id: cargo-fmt
        name: cargo fmt --check
        entry: >-
          bash -c 'command -v cargo >/dev/null ||
          { echo "SKIP - cargo が無いため cargo fmt --check は走っていません。開発環境で cargo fmt --all を回してください"; exit 0; };
          cargo fmt --all -- --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
